specVersion: 1.3.0
description: "THINK staking protocol (Mainnet): StakingStorage and RewardManagerV1_1"
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: StakingStorage
    network: mainnet
    source:
      address: "0xFaa8A501cf7Ffd8080B0864F2C959E8cbcf83030"
      abi: StakingStorage
      startBlock: 22975181
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Staked
        - Unstaked
        - WalletAggregate
      abis:
        - name: StakingStorage
          file: ./abis/StakingStorage.json
      eventHandlers:
        - event: Staked(indexed address,indexed bytes32,uint128,indexed uint16,uint16,uint16)
          handler: handleStaked
        - event: Unstaked(indexed address,indexed bytes32,indexed uint16,uint128)
          handler: handleUnstaked
      file: ./src/staking-storage.ts
  - kind: ethereum
    name: RewardManagerV1_1
    network: mainnet
    source:
      address: "0xA865F7aA0c487e7A16b8192ABB7276D9D1bBd693"
      abi: RewardManagerV1_1
      startBlock: 23686623
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RewardClaimed
      abis:
        - name: RewardManagerV1_1
          file: ./abis/RewardManagerV1_1.json
      eventHandlers:
        - event: RewardClaimed(indexed address,bytes32,indexed uint256,indexed
            uint256,uint256,uint16)
          handler: handleRewardClaimed
      file: ./src/reward-manager.ts
  - kind: ethereum
    name: PoolManager
    network: mainnet
    source:
      address: "0xC7e162f85a4470046B22d059dc6a85A40f039AD1"
      abi: PoolManager
      startBlock: 23194149
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AnnouncePool
        - PoolUpserted
        - StrategyAddedToLayer
        - StrategyRemovedFromLayer
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: AnnouncePool(indexed uint256,uint16,uint16)
          handler: handleAnnouncePool
        - event: PoolUpserted(indexed uint256,uint16,uint16,uint256,indexed uint256)
          handler: handlePoolUpserted
        - event: StrategyAddedToLayer(uint256,uint256,uint256)
          handler: handleStrategyAddedToLayer
        - event: StrategyRemovedFromLayer(indexed uint256,uint256,uint256)
          handler: handleStrategyRemovedFromLayer
      file: ./src/pool-manager.ts
  - kind: ethereum
    name: ERC721MInitializableV1_0_1
    network: mainnet
    source:
      address: "0x11B3EfbF04F0bA505F380aC20444B6952970AdA6"
      abi: ERC721MInitializableV1_0_1
      startBlock: 22321767
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: ERC721MInitializableV1_0_1
          file: ./abis/ERC721MInitializableV1_0_1.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/erc-721-m-initializable-v-1-0-1.ts
