specVersion: 1.3.0
description: "THINK claiming"
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Claiming
    network: mainnet
    source:
      address: "0x97B267dCCef3D777518f3f36428DF24428125075"
      abi: Claiming
      startBlock: 22974922
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Claimed
      abis:
        - name: Claiming
          file: ./abis/Claiming.json
      eventHandlers:
        - event: Claimed(indexed address,uint128,uint32,uint16)
          handler: handleClaimed
      file: ./src/claiming.ts

